name: Verify Selected Work alignment
on:
  pull_request:
    types: [synchronize]
    branches: ["deploy/vercel"]
permissions:
  contents: read
jobs:
  homepage:
    if: github.head_ref == 'fix/case-study-image-scaling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --include=dev
      - run: npm run build:vercel
      - name: Check alignment, colors, and favicon
        run: |
          npm install --prefix "$RUNNER_TEMP/af-check" --no-audit --no-fund playwright-core@1.58.2
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          npm exec -- next start --hostname 127.0.0.1 --port 3000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/ --output /dev/null
          node scripts/check-selected-work.cjs
