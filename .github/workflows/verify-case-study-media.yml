name: Verify case study media
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["deploy/vercel"]

permissions:
  contents: read

jobs:
  media:
    if: github.head_ref == 'fix/case-study-image-scaling'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --include=dev
      - run: npm run build:vercel
      - name: Check MacBook, wide, and phone widths
        run: |
          npm install --prefix "$RUNNER_TEMP/case-study-check" --no-audit --no-fund playwright-core@1.58.2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          export CHROME_BIN
          if [[ -z "$CHROME_BIN" ]]; then
            "$RUNNER_TEMP/case-study-check/node_modules/.bin/playwright-core" install chromium
          fi
          npm exec -- next start --hostname 127.0.0.1 --port 3000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/ --output /dev/null
          node scripts/verify-case-study-media.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macbook-layout-screenshots
          path: ${{ runner.temp }}/case-study-layout-screenshots/
          if-no-files-found: ignore
          retention-days: 1
