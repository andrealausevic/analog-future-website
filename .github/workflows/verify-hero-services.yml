name: Verify desktop hero services
on:
  pull_request:
    types: [synchronize]
    branches: ["deploy/vercel"]
permissions:
  contents: read
jobs:
  services:
    if: github.head_ref == 'fix/case-study-image-scaling'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --include=dev
      - run: npm run build:vercel
      - name: Check service typography and responsive layout
        run: |
          npm install --prefix "$RUNNER_TEMP/services-check" --no-audit --no-fund playwright-core@1.58.2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          export CHROME_BIN
          npm exec -- next start --hostname 127.0.0.1 --port 3000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/ --output /dev/null
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { chromium } = require(process.env.RUNNER_TEMP + "/services-check/node_modules/playwright-core");
          
          (async () => {
            const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, args: ["--no-sandbox"] });
            try {
              const page = await browser.newPage({ reducedMotion: "reduce" });
              for (const width of [375, 832, 833, 1024, 1280, 1440, 1920]) {
                await page.setViewportSize({ width, height: 900 });
                const response = await page.goto("http://127.0.0.1:3000/");
                assert.ok(response.ok());
                const result = await page.evaluate(async () => {
                  await document.fonts.ready;
                  const properties = ["fontFamily", "fontSize", "fontWeight", "lineHeight", "letterSpacing"];
                  const list = document.querySelector(".af-hero__services");
                  const names = [...list.querySelectorAll(".af-hero__service-name")];
                  const numbers = [...list.querySelectorAll(".af-hero__service-number")];
                  const serviceStyle = getComputedStyle(names[0]);
                  const proseStyle = getComputedStyle(document.querySelector(".af-studio-teaser__description"));
                  const listBox = list.getBoundingClientRect();
                  const wordmarkBox = document.querySelector(".af-hero__future").getBoundingClientRect();
                  return {
                    typography: properties.map(name => serviceStyle[name]),
                    prose: properties.map(name => proseStyle[name]),
                    casing: serviceStyle.textTransform,
                    labels: names.map(name => name.textContent.trim()),
                    visibleNumbers: numbers.filter(number => number.getClientRects().length).map(number => number.textContent),
                    nameEdges: names.map(name => name.getBoundingClientRect().left),
                    listLeft: listBox.left,
                    listRight: listBox.right,
                    wordmarkLeft: wordmarkBox.left,
                    wordmarkRight: wordmarkBox.right
                  };
                });
                assert.deepEqual(result.labels, ["Brand strategy & identity", "Digital product design & dev", "AI products & systems"]);
                assert.ok(result.listRight <= width + 1);
                if (width > 832) {
                  assert.deepEqual(result.typography, result.prose);
                  assert.equal(result.casing, "none");
                  assert.deepEqual(result.visibleNumbers, []);
                  assert.ok(result.nameEdges.every(edge => Math.abs(edge - result.listLeft) < 1));
                  assert.ok(result.wordmarkRight <= result.listLeft + 1, "The desktop wordmark must fit beside the list");
                } else {
                  assert.equal(result.typography[1], "13px");
                  assert.equal(result.casing, "uppercase");
                  assert.deepEqual(result.visibleNumbers, ["01", "02", "03"]);
                  assert.ok(Math.abs(result.wordmarkLeft - result.listLeft) < 1);
                }
                console.log(width + "px " + JSON.stringify(result));
              }
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
