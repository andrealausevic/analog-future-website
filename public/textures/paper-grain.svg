<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="21" stitchTiles="stitch" result="grain"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.28" numOctaves="2" seed="7" stitchTiles="stitch" result="fibers"/>
    <feComposite in="grain" in2="fibers" operator="arithmetic" k1="0" k2="0.9" k3="0.1" k4="0"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="2.4" intercept="-0.7"/>
      <feFuncG type="linear" slope="2.4" intercept="-0.7"/>
      <feFuncB type="linear" slope="2.4" intercept="-0.7"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" fill="#808080" filter="url(#paper)"/>
</svg>
